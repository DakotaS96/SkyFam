<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8fd7ff"/>
    <stop offset="45%" stop-color="#e6f8ff"/>
    <stop offset="100%" stop-color="#ffe2a3"/>
  </linearGradient>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="10"
                  flood-color="#34516b"
                  flood-opacity=".16"/>
  </filter>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<!-- Happy background accents -->
<circle cx="120" cy="120" r="90"
        fill="#ffd75c" opacity=".85"/>

<circle cx="1460" cy="125" r="135"
        fill="#8ed4ff" opacity=".5"/>

<circle cx="1430" cy="760" r="170"
        fill="#ff9daf" opacity=".18"/>

<circle cx="155" cy="760" r="125"
        fill="#8fd5a4" opacity=".35"/>

<!-- Main card -->
<rect x="150" y="110"
      width="1300" height="680"
      rx="50"
      fill="#ffffff"
      opacity=".94"
      filter="url(#shadow)"/>

<!-- Heading -->
<text x="800" y="235"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="88"
      font-weight="700"
      fill="#244f7a">
  Games
</text>

<text x="800" y="310"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="32"
      fill="#4e687e">
  Click or tap a game icon on the launch bar to play
</text>

<!-- Launch bar -->
<rect x="285" y="410"
      width="1030" height="210"
      rx="45"
      fill="#253445"
      opacity=".94"
      filter="url(#shadow)"/>

<!-- Solitaire -->
<g transform="translate(405 455)">
  <rect width="150" height="125"
        rx="24"
        fill="#ffffff"
        opacity=".12"/>

  <text x="75" y="82"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="600"
        fill="#ffffff">
    A♠
  </text>
</g>

<!-- Mahjong -->
<g transform="translate(620 455)">
  <rect width="150" height="125"
        rx="24"
        fill="#ffffff"
        opacity=".12"/>

  <text x="75" y="84"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        fill="#ffffff">
    🀄
  </text>
</g>

<!-- Puzzle -->
<g transform="translate(835 455)">
  <rect width="150" height="125"
        rx="24"
        fill="#ffffff"
        opacity=".12"/>

  <text x="75" y="84"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        fill="#ffffff">
    🧩
  </text>
</g>

<!-- Bubble Shooter -->
<g transform="translate(1050 455)">
  <rect width="150" height="125"
        rx="24"
        fill="#ffffff"
        opacity=".12"/>

  <text x="75" y="84"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        fill="#ffffff">
    🫧
  </text>
</g>

<!-- Labels -->
<text x="480" y="675"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      font-weight="600"
      fill="#405d73">
  Solitaire
</text>

<text x="695" y="675"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      font-weight="600"
      fill="#405d73">
  Mahjong
</text>

<text x="910" y="675"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      font-weight="600"
      fill="#405d73">
  Puzzle
</text>

<text x="1125" y="675"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      font-weight="600"
      fill="#405d73">
  Bubble Shooter
</text>

</svg>
