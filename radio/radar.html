html,
body {

}


.radar-shell {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

}


/* =========================================================
   TOOLBAR
   ========================================================= */

.radar-toolbar {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        7px
        9px;

    box-sizing:
        border-box;

    background:
        #161616;

    border-bottom:
        1px solid #333;

    flex-shrink: 0;

}


.radar-title {

    font-weight: 600;

    font-size:
        0.95rem;

    white-space:
        nowrap;

}


.location-select {

    min-width: 175px;

    max-width: 230px;

    padding:
        7px
        8px;

    border-radius:
        7px;

    border:
        1px solid #444;

    background:
        #252525;

    color:
        white;

}


.zip-location {

    display: flex;
    gap: 4px;

}

.zip-location input {

    width: 78px;

    padding: 7px 6px;

    border-radius: 7px;

    border: 1px solid #444;

    background: #252525;

    color: white;

    box-sizing: border-box;

}

.zip-location input::placeholder {

    color: #aaa;

}


.view-buttons {

    display: flex;

    gap: 5px;

    margin-left:
        auto;

}


button {

    border:

    border-radius:

    background:

    color:

    padding:

    cursor:

}


button:hover {

}


button.active {

        #50ff96;

    background:

}


.radio-button {

    margin-left:

}


/* =========================================================
   MAP
   ========================================================= */

#radarMap {

    flex: 1;

    min-height: 0;

    width: 100%;

    background:
        #111;

}


/* Darker Leaflet controls */

.leaflet-control-zoom a {

    background:
        #222 !important;

    color:
        white !important;

    border-color:
        #444 !important;

}


.leaflet-control-attribution {

    font-size:
        9px;

}


/* =========================================================
   STATUS
   ========================================================= */

.radar-status {

    position:
        absolute;

    z-index:
        1000;

    left:
        10px;

    bottom:
        10px;

    background:
        rgba(
            0,
            0,
            0,
            0.72

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.18
        );

    border-radius:
        7px;

    padding:
        5px
        8px;

    font-size:
        0.72rem;

    pointer-events:
        none;

}


/* =========================================================
   MOBILE / SMALL DASHBOARD PANEL
   ========================================================= */

@media (
    max-width:
        750px

    .radar-toolbar {

        gap: 4px;

        padding: 5px;

    }

            0.75rem;

            7px 4px;

    .zip-location input {

        margin-left: 0;

        gap: 3px;

    }


    button {

        padding:
            7px
            6px;

        font-size:
            0.72rem;

    }

}

<script>


/* =========================================================
   MAP
   ========================================================= */


const map =
    L.map(
        "radarMap",
        {

            zoomControl:
                true,

            attributionControl:
                true

        }
    );


/*
 * OpenStreetMap basemap.
 */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom:
            18,

        attribution:
            "&copy; OpenStreetMap contributors"

    }
).addTo(
    map
);


/* =========================================================
   NOAA / NWS CONUS RADAR
   ========================================================= */


/*
 * NOAA/NWS MRMS
 * Composite Base Reflectivity
 */

const radarLayer =
    L.tileLayer.wms(
        "https://opengeo.ncep.noaa.gov/geoserver/conus/conus_bref_qcd/ows",
        {

            layers:
                "conus_bref_qcd",

            format:
                "image/png",

            transparent:
                true,

            opacity:
                0.68,

            version:
                "1.3.0",

            attribution:
                "NOAA / National Weather Service"

        }
    );


radarLayer.addTo(
    map
);


/* =========================================================
   ELEMENTS
   ========================================================= */


const locationSelect =
    document.getElementById(
        "radarLocation"
    );


const zipInput =
    document.getElementById(
        "zipInput"
    );


const zipButton =
    document.getElementById(
        "zipButton"
    );

const reloadRadarButton =
    document.getElementById(
        "reloadRadarButton"
    );


if (reloadRadarButton) {
    reloadRadarButton.addEventListener(
        "click",
        () => {
            window.location.reload();
        }
    );
}

const localButton =
    document.getElementById(
        "localButton"
    );


const regionalButton =
    document.getElementById(
        "regionalButton"
    );


const nationalButton =
    document.getElementById(
        "nationalButton"
    );


const radioButton =
    document.getElementById(
        "radioButton"
    );


const status =
    document.getElementById(
        "radarStatus"
    );


let currentView =
    "local";


let customLocation =
    null;

const userLocationsStorageKey =
    "skyfamRadarUserLocations";


function sortLocationOptions() {

    const options =
        Array.from(
            locationSelect.options
        );

    options.sort(
        (first, second) => {

            const firstState =
                first.value.match(
                    /^([A-Z]{2})-/
                )?.[1] ||
                first.textContent.match(
                    /,\s*([A-Z]{2})(?:\s|$)/
                )?.[1] ||
                "ZZ";

            const secondState =
                second.value.match(
                    /^([A-Z]{2})-/
                )?.[1] ||
                second.textContent.match(
                    /,\s*([A-Z]{2})(?:\s|$)/
                )?.[1] ||
                "ZZ";

            const firstName =
                first.textContent.trim();

            const secondName =
                second.textContent.trim();

            return (
                firstState +
                "-" +
                firstName
            ).localeCompare(
                secondState +
                "-" +
                secondName
            );
        }
    );

    options.forEach(
        option =>
            locationSelect.appendChild(
                option
            )
    );
}

function cleanLocationName(name) {

    return String(name)
        .trim()
        .replace(
            /,\\s*([A-Z]{2})\\s+\\d{5}\\s*$/,
            ", $1"
        )
        .trim();
}


function displayRadarLocationName(name) {

    return String(name)
        .trim()
        .replace(
            /,\s*([A-Z]{2})\s+\d{5}\s*$/,
            ", $1"
        )
        .trim();
}

function addLocationOption(location) {

    if (
        !location ||
        !location.id ||
        !Number.isFinite(Number(location.lat)) ||
        !Number.isFinite(Number(location.lon))
    ) {
        return;
    }

    let option =
        Array.from(
            locationSelect.options
        ).find(
            existing =>
                existing.value ===
                location.id
        );

    if (!option) {
        option =
            document.createElement(
                "option"
            );

        option.value =
            location.id;

        locationSelect.appendChild(
            option
        );
    }

    option.textContent = displayRadarLocationName(location.name);

    option.dataset.lat =
        String(location.lat);

    option.dataset.lon =
        String(location.lon);

    sortLocationOptions();
}

function rememberLocationOption(location) {

    addLocationOption(location);

    let saved = [];

    try {
        saved =
            JSON.parse(
                localStorage.getItem(
                    userLocationsStorageKey
                ) || "[]"
            );
    } catch (error) {
        saved = [];
    }

    saved =
        saved.filter(
            existing =>
                existing.id !==
                location.id
        );

    saved.push({
        id: location.id,
        name: location.name,
        lat: Number(location.lat),
        lon: Number(location.lon)
    });

    localStorage.setItem(
        userLocationsStorageKey,
        JSON.stringify(saved)
    );
}

sortLocationOptions();

function loadRememberedLocationOptions() {

    try {
        const saved =
            JSON.parse(
                localStorage.getItem(
                    userLocationsStorageKey
                ) || "[]"
            );

        saved.forEach(
            addLocationOption
        );
    } catch (error) {
        console.warn(
            "Saved radar locations could not be loaded",
            error
        );
    }
}



/* =========================================================
   HELPERS
   ========================================================= */


function selectedLocation() {


    if (customLocation) {

        return customLocation;

    }


    const option =
        locationSelect.options[
            locationSelect.selectedIndex
        ];


    return {

        id:
            option.value,

        name:
            option.textContent.trim(),

        lat:
            Number(
                option.dataset.lat
            ),

        lon:
            Number(
                option.dataset.lon
            )

    };


}


function setActiveButton(
    view
) {


    localButton.classList.toggle(
        "active",
        view === "local"
    );


    regionalButton.classList.toggle(
        "active",
        view === "regional"
    );


    nationalButton.classList.toggle(
        "active",
        view === "national"
    );


}


function setView(
    view
) {


    const location =
        selectedLocation();


    currentView =
        view;


    setActiveButton(
        view
    );


    if (
        view === "local"
    ) {


        map.setView(
            [
                location.lat,
                location.lon
            ],
            customLocation
                ? 9
                : 8
        );


        status.textContent =
            "Local radar • " +
            location.name;


    }


    else if (
        view === "regional"
    ) {


        map.setView(
            [
                location.lat,
                location.lon
            ],
            6
        );


        status.textContent =
            "Regional radar • " +
            location.name;


    }


    else {


        map.setView(
            [
                38.5,
                -96.0
            ],
            4
        );


        status.textContent =
            "National radar";


    }


    localStorage.setItem(
        "skyfamRadarView",
        view
    );


}


/* =========================================================
   FAMILYCHAT AUTOFOCUS PAUSE
   Only while city selector or ZIP input is being used.
   ========================================================= */

function setFamilyChatFocusPause(paused) {

    window.parent.postMessage(
        {
            action: "familyChatFocusPause",
            paused: paused
        },
        "*"
    );

}


locationSelect.addEventListener(
    "focus",
    () => {

        setFamilyChatFocusPause(
            true
        );

    }
);


locationSelect.addEventListener(
    "blur",
    () => {

        setFamilyChatFocusPause(
            false
        );

    }
);


zipInput.addEventListener(
    "focus",
    () => {

        setFamilyChatFocusPause(
            true
        );

    }
);


zipInput.addEventListener(
    "blur",
    () => {

        setFamilyChatFocusPause(
            false
        );

    }
);


/* =========================================================
   LOCATION CHANGE
   ========================================================= */


locationSelect.addEventListener(
    "change",
    () => {


        customLocation =
            null;


        localStorage.removeItem(
            "skyfamRadarCustomLocation"
        );


        localStorage.setItem(
            "skyfamRadarLocation",
            locationSelect.value
        );


        /*
         * Selecting a location while National is open
         * returns the user to Local.
         */

        setView(
            currentView === "national"
                ? "local"
                : currentView
        );


    }
);


/* =========================================================
   ZIP CODE LOCATION
   ========================================================= */


async function setZipLocation() {


    const zip =
        zipInput.value
            .trim();


    if (
        !/^\d{5}$/.test(
            zip
        )
    ) {

        status.textContent =
            "Enter a valid 5-digit ZIP code";

        return;

    }


    zipButton.disabled =
        true;


    status.textContent =
        "Finding ZIP " +
        zip +
        "...";


    try {


        const response =
            await fetch(
                "https://api.zippopotam.us/us/" +
                encodeURIComponent(
                    zip
                )
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "ZIP code not found"
            );

        }


        const data =
            await response.json();


        const place =
            data.places &&
            data.places[0];


        if (
            !place
        ) {

            throw new Error(
                "No location returned"
            );

        }


        customLocation = {

            id:
                "ZIP-" + zip,

            name:
                place["place name"] +
                ", " +
                place["state abbreviation"] +
                " " +
                zip,

            lat:
                Number(
                    place.latitude
                ),

            lon:
                Number(
                    place.longitude
                )

        };

        customLocation.name =
            displayRadarLocationName(
                customLocation.name
            );

        rememberLocationOption(
            customLocation
        );

        locationSelect.value =
            customLocation.id;

        localStorage.setItem(
            "skyfamRadarLocation",
            customLocation.id
        );


        localStorage.setItem(
            "skyfamRadarCustomLocation",
            JSON.stringify(
                customLocation
            )
        );


        localStorage.setItem(
            "skyfamRadarZip",
            zip
        );


        /*
         * Clear the visible input after a successful lookup.
         * The selected ZIP location itself is still remembered.
         */
        zipInput.value =
            "";


        setView(
            "local"
        );


    }

    catch (error) {


        console.error(
            "ZIP lookup failed:",
            error
        );


        status.textContent =
            "Unable to find ZIP " +
            zip;


    }

    finally {


        zipButton.disabled =
            false;


    }


}


zipButton.addEventListener(
    "click",
    setZipLocation
);


zipInput.addEventListener(
    "keydown",
    event => {


        if (
            event.key ===
            "Enter"
        ) {


            event.preventDefault();


            setZipLocation();


        }


    }
);


/* =========================================================
   VIEW BUTTONS
   ========================================================= */


localButton.addEventListener(
    "click",
    () => {

        setView(
            "local"
        );

    }
);


regionalButton.addEventListener(
    "click",
    () => {

        setView(
            "regional"
        );

    }
);


nationalButton.addEventListener(
    "click",
    () => {

        setView(
            "national"
        );

    }
);


/* =========================================================
   RADIO
   ========================================================= */


radioButton.addEventListener(
    "click",
    () => {

        /*
         * Radar can be displayed two ways:
         *
         * 1. Directly in the SkyFam dashboard iframe.
         *    In that case, switch the iframe to Radio.
         *
         * 2. Inside the Radio page's Radar overlay.
         *    In that case, close the overlay and reveal
         *    the already-running Radio page underneath.
         */

        if (
            window.parent !==
            window.top
        ) {

            window.parent.postMessage(
                {
                    action:
                        "closeRadarOverlay"
                },
                "*"
            );

        } else {

            window.location.href =
                "/";

        }

    }
);


/* =========================================================
   DASHBOARD RADIO MESSAGES
   ========================================================= */


window.addEventListener(
    "message",
    event => {


        if (
            !event.data ||
            typeof event.data !==
                "object"
        ) {

            return;

        }


        /*
         * Radar occupies the old Radio iframe.
         * Ignore old radio play/pause commands safely.
         */

        if (
            event.data.action ===
                "pauseRadio" ||

            event.data.action ===
                "playRadio"
        ) {

            return;

        }


    }
);


/* =========================================================
   INITIAL LOCATION
   ========================================================= */


loadRememberedLocationOptions();
normalizeSavedLocationLabels();


function normalizeSavedLocationLabels() {

    Array.from(
        locationSelect.options
    ).forEach(
        option => {
            option.textContent =
                cleanLocationName(
                    option.textContent
                );
        }
    );

    try {
        const saved =
            JSON.parse(
                localStorage.getItem(
                    userLocationsStorageKey
                ) || "[]"
            );

        saved.forEach(
            location => {
                location.name =
                    cleanLocationName(
                        location.name
                    );
            }
        );

        localStorage.setItem(
            userLocationsStorageKey,
            JSON.stringify(saved)
        );

        const savedCustom =
            localStorage.getItem(
                "skyfamRadarCustomLocation"
            );

        if (savedCustom) {
            const custom =
                JSON.parse(savedCustom);

            custom.name =
                cleanLocationName(
                    custom.name
                );

            localStorage.setItem(
                "skyfamRadarCustomLocation",
                JSON.stringify(custom)
            );
        }
    } catch (error) {
        console.warn(
            "Radar location cleanup failed",
            error
        );
    }

    sortLocationOptions();
}


const savedCustomLocation =
    localStorage.getItem(
        "skyfamRadarCustomLocation"
    );


if (
    savedCustomLocation
) {

    try {

        customLocation =
            JSON.parse(
                savedCustomLocation
            );


        zipInput.value =
            localStorage.getItem(
                "skyfamRadarZip"
            ) || "";

    }

    catch (error) {

        customLocation =
            null;

    }

}


const savedLocation =
    localStorage.getItem(
        "skyfamRadarLocation"
    );


if (
    savedLocation
) {


    const matchingOption =
        Array.from(
            locationSelect.options
        )
        .some(
            option =>
                option.value ===
                savedLocation
        );


    if (
        matchingOption
    ) {

        locationSelect.value =
            savedLocation;

    }


}


/*
 * Evansville remains the development default.
 * Public SkyFam can later use first-run selection instead.
 */


/* =========================================================
   INITIAL VIEW
   ========================================================= */


const savedView =
    localStorage.getItem(
        "skyfamRadarView"
    );


if (
    savedView === "local" ||
    savedView === "regional" ||
    savedView === "national"
) {


    currentView =
        savedView;


}


setView(
    currentView
);


/*
 * Leaflet sometimes calculates dimensions before an iframe
 * is completely laid out.
 */

setTimeout(
    () => {

        map.invalidateSize();

    },
    250
);


/* =========================================================
   DASHBOARD INTERACTION LOCK

   Every interaction with Radar tells the parent dashboard
   that FamilyChat autofocus should temporarily stand down.
   ========================================================= */


let interactionTimer =
    null;


function notifyRadarInteraction() {


    window.parent.postMessage(
        {
            action:
                "radarInteraction"
        },
        "*"
    );


    clearTimeout(
        interactionTimer
    );


    /*
     * Keep sending a fresh interaction notification
     * while a control may still be in use.
     */

    interactionTimer =
        setTimeout(
            () => {},
            30000
        );


}


[
    "pointerdown",
    "mousedown",
    "touchstart",
    "focusin",
    "keydown"
].forEach(
    eventName => {

        document.addEventListener(
            eventName,
            notifyRadarInteraction,
            true
        );

    }
);


/* =========================================================
   RADAR REFRESH
   ========================================================= */


/*
 * Refresh the WMS tiles every 5 minutes without requiring
 * the user to reload SkyFam.
 */

setInterval(
    () => {


        radarLayer.setParams(
            {

                _refresh:
                    Date.now()

            },
            false
        );


        radarLayer.redraw();


    },
    300000
);


</script>
